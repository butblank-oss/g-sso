<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>지쏘 가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f2f4f6; --card:#ffffff; --text:#191f28; --sub:#6b7684; --faint:#b0b8c1; --line:#e5e8eb;
  --blue:#3182f6; --blue-weak:#e8f3ff; --red:#f04452; --red-weak:#ffeeee; --green:#15b886; --green-weak:#e6f8f1;
  --amber:#ffb331; --amber-weak:#fff6e5; --purple:#8b5cf6; --purple-weak:#f2edff; --teal:#14a8b8; --teal-weak:#e3f7f9;
  --orange:#ff7a33; --orange-weak:#fff1e8;
  --radius:20px; --radius-s:12px; --shadow:0 1px 2px rgba(0,0,0,.04);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101114; --card:#1b1d22; --text:#f2f4f6; --sub:#9aa3ad; --faint:#5d6670; --line:#2b2e34;
    --blue:#4b93ff; --blue-weak:#1a2a44; --red:#ff5c69; --red-weak:#3a1d22; --green:#2fcf9d; --green-weak:#15302a;
    --amber:#ffc04d; --amber-weak:#3a2e16; --purple:#a07bff; --purple-weak:#2a2142; --teal:#3cc4d2; --teal-weak:#15313a;
    --orange:#ff9254; --orange-weak:#3a2416; --shadow:none;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* 레이아웃 */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--text)}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:4px;width:232px;padding:28px 16px;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line)}
  .side .brand{font-weight:800;font-size:19px;padding:0 12px 20px}
  .side button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius-s);color:var(--sub);font-weight:600;text-align:left}
  .side button svg{width:20px;height:20px}
  .side button:hover{background:var(--bg)}
  .side button[aria-current="page"]{background:var(--bg);color:var(--text)}
  .side .grow{flex:1}
  .tabbar{display:none}
  .main{max-width:1080px;padding:32px 40px 64px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .fab{right:40px;bottom:40px}
}

/* 공통 */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{font-size:17px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-size:13px;color:var(--sub);font-weight:500}
.muted{color:var(--sub)}
.tiny{font-size:12px;color:var(--sub)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);padding:6px 10px;border-radius:999px;background:var(--card)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--green)} .sync.busy i{background:var(--amber);animation:pulse 1s infinite} .sync.err i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}

/* 월 이동 */
.month{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:800}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.month button:hover{background:var(--card)}
.month button:disabled{opacity:.3;cursor:default}

/* 요약 */
.hero .label{font-size:14px;color:var(--sub)}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px}
.hero .big.minus{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--bg);border-radius:var(--radius-s);padding:12px}
.stats span{display:block;font-size:12px;color:var(--sub)}
.stats b{font-size:16px;font-weight:700}
.alert{display:flex;gap:10px;align-items:center;padding:14px 16px;border-radius:var(--radius-s);background:var(--amber-weak);margin-bottom:12px;font-size:14px}
.alert button{margin-left:auto;font-weight:700;color:var(--blue);white-space:nowrap}

/* 예산 바 */
.bud{padding:10px 0}
.bud + .bud{border-top:1px solid var(--line)}
.bud .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.bud .row b{font-weight:600}
.bud .row .r{color:var(--sub);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--bg);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .5s var(--ease)}
.bar i.warn{background:var(--amber)} .bar i.over{background:var(--red)}
.over-t{color:var(--red)!important;font-weight:600}
.group-t{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 2px}
.group-t:first-child{margin-top:0}

/* 목록 */
.day{font-size:13px;color:var(--sub);font-weight:600;margin:16px 4px 6px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:var(--radius-s);width:100%;text-align:left;margin-bottom:6px;transition:transform .15s var(--ease)}
.item:active{transform:scale(.98)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid span{font-size:12px;color:var(--sub)}
.item .amt{font-weight:700;white-space:nowrap}
.item .amt.in{color:var(--blue)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;background:var(--bg);font-size:14px;font-weight:500;white-space:nowrap;border:1.5px solid transparent;transition:background .15s,border-color .15s}
.chip[aria-pressed="true"]{border-color:currentColor;font-weight:700}
.chip.sm{padding:5px 10px;font-size:13px}
.g-수입{color:var(--blue);background:var(--blue-weak)}
.g-고정비{color:var(--teal);background:var(--teal-weak)}
.g-변동비{color:var(--orange);background:var(--orange-weak)}
.g-비정기{color:var(--purple);background:var(--purple-weak)}
.g-저축{color:var(--green);background:var(--green-weak)}
.g-none{color:var(--sub);background:var(--bg)}
.chip.plain{color:var(--text)}
.chip.plain[aria-pressed="true"]{background:var(--text);color:var(--card);border-color:var(--text)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:52px;padding:0 20px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;width:100%;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:scale(.98)}
.btn:focus-visible,.chip:focus-visible,.item:focus-visible,.link:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn:disabled{background:var(--line);color:var(--faint);cursor:not-allowed;transform:none}
.btn.sub{background:var(--bg);color:var(--text)}
.btn.danger{background:var(--red-weak);color:var(--red)}
.btn.sm{height:40px;font-size:14px;width:auto;padding:0 14px;border-radius:10px}
.btn.loading{pointer-events:none;opacity:.7}
.row-btns{display:flex;gap:8px}
.link{color:var(--blue);font-weight:600;font-size:14px}
.fab{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(49,130,246,.35);z-index:15;transition:transform .15s var(--ease)}
.fab:active{transform:scale(.92)} .fab svg{width:26px;height:26px}

/* 입력 */
.field{margin-bottom:18px}
.field > label,.field > .lab{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px}
.inp{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--blue)}
.inp.err{border-color:var(--red)}
.err-t{color:var(--red);font-size:13px;margin-top:6px;display:none}
.err-t.on{display:block}
.amount-inp{font-size:28px;font-weight:800;height:60px;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:0 2px;background:transparent}
.amount-inp:focus{border-color:var(--blue)}
textarea.inp{height:140px;padding:12px 14px;font-size:14px;resize:vertical}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{flex:1;height:40px;border-radius:9px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 시트 (바텀시트 / 모달) */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s var(--ease);z-index:41}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:20px;font-weight:800;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.x:hover{background:var(--bg)}
@media (min-width:960px){
  .sheet{left:50%;top:50%;bottom:auto;right:auto;width:480px;max-height:86vh;border-radius:24px;padding:24px 28px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .22s var(--ease),opacity .22s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
}

/* 토스트·스낵바 */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#191f28;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#7db7ff;font-weight:700}
@media (min-width:960px){.toast{bottom:40px}}

/* 빈 화면 */
.empty{text-align:center;padding:40px 20px}
.empty .em{font-size:40px;margin-bottom:8px}
.empty b{display:block;font-size:17px;margin-bottom:4px}
.empty p{color:var(--sub);font-size:14px;margin-bottom:18px}
.empty .btn{width:auto}

/* 붙여넣기 미리보기 */
.prev{width:100%;border-collapse:collapse;font-size:14px}
.prev td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.prev td.a{text-align:right;font-weight:600;white-space:nowrap}
.prev tr.dup td{opacity:.4}
.prev select{border:0;border-radius:999px;padding:6px 8px;font-size:13px;font-weight:600;max-width:120px}
.cb{width:20px;height:20px;accent-color:var(--blue)}

/* 설정 목록 */
.set-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .nm{flex:1;font-weight:500}
.set-row input.inp{height:40px;width:130px;text-align:right;font-size:15px}
.del{color:var(--faint);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.del:hover{color:var(--red);background:var(--red-weak)}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row .inp{height:44px;font-size:15px}
.add-row select.inp{width:auto}
details.card summary{font-size:17px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);transition:transform .2s}
details.card[open] summary::after{transform:rotate(-135deg)}
details.card[open] summary{margin-bottom:12px}
.field > label.drop,.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 16px;border:2px dashed var(--line);border-radius:16px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-weak)}
.drop-ic{font-size:30px}.drop b{font-size:16px;word-break:break-all}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mapc span{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.mapc .inp{height:44px;font-size:14px;padding:0 8px}
.hide{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="메뉴">
    <div class="brand">지쏘 가계부</div>
    <div id="sideNav"></div>
    <div class="grow"></div>
    <button id="sideAdd" class="btn" style="color:#fff;justify-content:center">+ 기록하기</button>

  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="메뉴"></nav>
<button class="fab" id="fab" aria-label="기록하기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="dim" id="dim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

 ['쿠팡이츠','식비'],['배달의민족','식비'],['배민','식비'],['요기요','식비'],['쿠팡와우','구독'],['와우멤버십','구독'],['네이버플러스','구독'],['넷플릭스','구독'],['유튜브','구독'],['우주패스','구독'],['티빙','구독'],['디즈니','구독'],

 ['KTX','교통'],['SRT','교통'],['코레일','교통'],['카카오T','교통'],['택시','교통'],['티머니','교통'],['버스','교통'],['지하철','교통'],['K-패스','교통'],
 ['스타벅스','카페/편의점'],['메가커피','카페/편의점'],['메가MGC','카페/편의점'],['이디야','카페/편의점'],['투썸','카페/편의점'],['컴포즈','카페/편의점'],['빽다방','카페/편의점'],['커피','카페/편의점'],['카페','카페/편의점'],['GS25','카페/편의점'],['CU','카페/편의점'],['세븐일레븐','카페/편의점'],['이마트24','카페/편의점'],['편의점','카페/편의점'],
 ['트레이더스','식비'],['이마트','식비'],['롯데마트','식비'],['홈플러스','식비'],['롯데슈퍼','식비'],['하나로마트','식비'],['컬리','식비'],['맥도날드','식비'],['버거킹','식비'],['맘스터치','식비'],['롯데리아','식비'],['김밥','식비'],['파리바게','식비'],['뚜레쥬르','식비'],
 ['동물병원','반려견'],['개밥왕','반려견'],['로얄캐닌','반려견'],['애견','반려견'],['펫','반려견'],

function defaultSettings(){return {cats:DEFAULT_CATS.map(c=>({...c})), pays:[...DEFAULT_PAYS], rules:DEFAULT_RULES.map(r=>({...r})), updatedAt:0}}
function loadLocal(){
  try{const d=JSON.parse(localStorage.getItem(LS_DATA)); if(d&&d.settings&&Array.isArray(d.tx)) return d;}catch(e){}
  return {tx:[], settings:defaultSettings()};
}
function saveLocal(){try{localStorage.setItem(LS_DATA,JSON.stringify(state))}catch(e){}}
function touchSettings(){state.settings.updatedAt=Date.now(); persist();}
function persist(){saveLocal(); scheduleSync();}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>(Math.round(n)||0).toLocaleString('ko-KR');
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shiftMonth(mk,n){const [y,m]=mk.split('-').map(Number);return monthKey(new Date(y,m-1+n,1))}
function monthLabel(mk){const [y,m]=mk.split('-');return `${y}년 ${Number(m)}월`}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function catOf(name){return state.settings.cats.find(c=>c.name===name)}
function groupOf(name){return catOf(name)?.group||'none'}
const liveTx=()=>state.tx.filter(t=>!t.deleted);
const monthTx=mk=>liveTx().filter(t=>t.date&&t.date.slice(0,7)===mk);
function autoCat(text){
  const s=String(text||'').toLowerCase();
  for(const r of state.settings.rules){ if(r.kw && s.includes(r.kw.toLowerCase())) return r.cat; }
  return '';
}
function normDate(v){
  v=String(v||'').trim(); let m;
  if((m=v.match(/^(\d{4})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=v.match(/^(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/))) return `20${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=v.match(/^(\d{1,2})[.\-\/](\d{1,2})$/))) return `${ui.month.slice(0,4)}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  if((m=v.match(/^(\d{4})(\d{2})(\d{2})$/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function toNum(v){const s=String(v||'').replace(/[,\s원₩]/g,''); return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN}

function render(){
  const nav=TABS.map(([k,l,i])=>`<button data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${i}<span>${l}</span></button>`).join('');
  $('#tabbar').innerHTML=nav; $('#sideNav').innerHTML=nav;
  $('#fab').classList.toggle('hide', ui.tab==='settings'||ui.tab==='import');
  const v={home:viewHome,list:viewList,import:viewImport,settings:viewSettings}[ui.tab]();
  $('#main').innerHTML=v;
  if(ui.tab==='import') bindImport();
}
function syncBadge(){
  if(!sync.url) return `<button class="sync" data-go="settings"><i></i>이 기기에만 저장 중</button>`;
  const cls={ok:'ok',busy:'busy',err:'err'}[ui.syncStatus]||'';
  const txt={ok:'동기화됨',busy:'저장 중',err:'동기화 실패'}[ui.syncStatus]||'연결됨';
  return `<button class="sync ${cls}" data-act="syncNow" title="${esc(ui.syncMsg)}"><i></i>${txt}</button>`;
}
function monthNav(){
  const next=shiftMonth(ui.month,1), cur=monthKey(new Date());
  return `<div class="month"><button data-act="prevM" aria-label="이전 달">${IC.left}</button><span>${monthLabel(ui.month)}</span><button data-act="nextM" aria-label="다음 달" ${next>cur?'disabled':''}>${IC.right}</button></div>`;
}
function sums(mk){
  const by={}; let inc=0,exp=0,sav=0,unc=0,uncN=0;
  for(const t of monthTx(mk)){
    const g=groupOf(t.cat); by[t.cat]=(by[t.cat]||0)+t.amount;
    if(g==='수입') inc+=t.amount; else if(g==='저축') sav+=t.amount; else if(g==='none'){unc+=t.amount;uncN++;} else exp+=t.amount;
  }
  return {by,inc,exp,sav,unc,uncN,left:inc-exp-sav-unc};
}

function viewHome(){
  const s=sums(ui.month), cats=state.settings.cats;
  const spendBudget=cats.filter(c=>!['수입','저축'].includes(c.group)).reduce((a,c)=>a+(c.budget||0),0);
  const rate=spendBudget?Math.round((s.exp/spendBudget)*100):0;
  const has=monthTx(ui.month).length>0;
  let budgetHtml='';
  for(const g of ['고정비','변동비','비정기','저축']){
    const list=cats.filter(c=>c.group===g&&((c.budget||0)>0||(s.by[c.name]||0)>0));
    if(!list.length) continue;
    budgetHtml+=`<div class="group-t">${g}</div>`+list.map(c=>{
      const used=s.by[c.name]||0, b=c.budget||0, p=b?used/b:0;
      const cls=p>=1?'over':p>=.8?'warn':'';
      const right=b?(used>b?`<span class="r over-t">${won(used-b)}원 초과</span>`:`<span class="r">${won(b-used)}원 남음</span>`):'<span class="r">예산 없음</span>';
      return `<div class="bud"><div class="row"><b>${esc(c.name)}</b>${right}</div><div class="row"><span class="tiny num">${won(used)} / ${won(b)}원</span></div><div class="bar"><i class="${cls}" style="width:${Math.min(100,p*100)}%"></i></div></div>`;
    }).join('');
  }
  const pays={}; for(const t of monthTx(ui.month)) if(groupOf(t.cat)!=='수입') pays[t.pay||'미지정']=(pays[t.pay||'미지정']||0)+t.amount;
  const payHtml=Object.entries(pays).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`<div class="bud"><div class="row"><b>${esc(p)}</b><span class="num">${won(v)}원</span></div></div>`).join('');
  const recent=monthTx(ui.month).sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt-a.updatedAt).slice(0,5);
  return `
  <div class="top">${monthNav()}${syncBadge()}</div>
  ${s.uncN?`<div class="alert">🔎 분류가 안 된 내역 <b>${s.uncN}건</b> (${won(s.unc)}원)<button data-act="showUnc">분류하기</button></div>`:''}
  <div class="grid2">
   <div>
    <div class="card hero">
      <div class="label">이번 달 남은 돈</div>
      <div class="big num ${s.left<0?'minus':''}">${won(s.left)}원</div>
      <div class="stats">
        <div><span>수입</span><b class="num">${won(s.inc)}</b></div>
        <div><span>지출</span><b class="num">${won(s.exp+s.unc)}</b></div>
        <div><span>저축</span><b class="num">${won(s.sav)}</b></div>
      </div>
    </div>
    <div class="card"><h2>최근 내역 <button class="link" data-go="list">전체 보기</button></h2>
      ${recent.length?recent.map(itemHtml).join(''):emptyHtml('📝','아직 기록이 없어요','첫 지출이나 수입을 적어보세요','첫 기록하기','add')}
    </div>
    ${payHtml?`<div class="card"><h2>결제수단별 사용액</h2>${payHtml}</div>`:''}
   </div>
   <div>
    <div class="card"><h2>예산 <small>지출 예산의 ${rate}% 사용</small></h2>
      ${has||spendBudget?budgetHtml||'<p class="muted">예산이 없어요</p>':''}
      ${!spendBudget?emptyHtml('🎯','예산을 정해보세요','분류별로 한 달 예산을 넣으면 얼마나 썼는지 보여드려요','예산 정하기','go:settings'):''}
    </div>
   </div>
  </div>`;
}
function emptyHtml(em,t,p,btn,act){
  const a=act.startsWith('go:')?`data-go="${act.slice(3)}"`:`data-act="${act}"`;
  return `<div class="empty"><div class="em">${em}</div><b>${t}</b><p>${p}</p><button class="btn sm" ${a}>${btn}</button></div>`;
}
function itemHtml(t){
  const g=groupOf(t.cat), inc=g==='수입';
  const label=t.memo||t.merchant||t.cat||'미분류';
  return `<button class="item" data-edit="${t.id}"><span class="ico g-${g}">${esc((t.cat||'?').slice(0,2))}</span><span class="mid"><b>${esc(label)}</b><span>${esc(t.cat||'미분류')} · ${esc(t.pay||'결제수단 없음')}</span></span><span class="amt num ${inc?'in':''}">${inc?'+':'-'}${won(t.amount)}원</span></button>`;
}
function viewList(){
  let list=monthTx(ui.month);
  if(ui.filterCat==='__unc') list=list.filter(t=>groupOf(t.cat)==='none');
  else if(ui.filterCat) list=list.filter(t=>t.cat===ui.filterCat);
  if(ui.filterPay) list=list.filter(t=>t.pay===ui.filterPay);
  list.sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt-a.updatedAt);
  const days={}; list.forEach(t=>(days[t.date]=days[t.date]||[]).push(t));
  const usedCats=[...new Set(monthTx(ui.month).map(t=>t.cat))];
  const catChips=`<button class="chip sm plain" aria-pressed="${!ui.filterCat}" data-fcat="">전체</button>`+
    (monthTx(ui.month).some(t=>groupOf(t.cat)==='none')?`<button class="chip sm g-none" aria-pressed="${ui.filterCat==='__unc'}" data-fcat="__unc">미분류</button>`:'')+
    usedCats.filter(c=>catOf(c)).map(c=>`<button class="chip sm g-${groupOf(c)}" aria-pressed="${ui.filterCat===c}" data-fcat="${esc(c)}">${esc(c)}</button>`).join('');
  const payChips=`<button class="chip sm plain" aria-pressed="${!ui.filterPay}" data-fpay="">모든 결제수단</button>`+state.settings.pays.map(p=>`<button class="chip sm plain" aria-pressed="${ui.filterPay===p}" data-fpay="${esc(p)}">${esc(p)}</button>`).join('');
  const total=list.reduce((a,t)=>a+(groupOf(t.cat)==='수입'?0:t.amount),0);
  return `<div class="top">${monthNav()}${syncBadge()}</div>
  <div class="filters">${catChips}</div><div class="filters">${payChips}</div>
  <p class="tiny" style="margin:6px 4px 0">${list.length}건 · 지출 ${won(total)}원</p>
  ${list.length?Object.entries(days).map(([d,ts])=>{
    const dt=new Date(d+'T00:00:00'); const wd='일월화수목금토'[dt.getDay()];
    const daySum=ts.reduce((a,t)=>a+(groupOf(t.cat)==='수입'?0:t.amount),0);
    return `<div class="day"><span>${dt.getMonth()+1}월 ${dt.getDate()}일 (${wd})</span><span class="num">-${won(daySum)}원</span></div>`+ts.map(itemHtml).join('');
  }).join(''):`<div class="card">${emptyHtml('🗂️','이 조건의 내역이 없어요','필터를 풀거나 새로 기록해보세요','기록하기','add')}</div>`}`;
}

function bindImport(){

async function loadXLSX(){
  if(window.XLSX) return;
  await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('엑셀 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요'));document.head.appendChild(s);});
}
async function readXls(file){
  if(!imp.pay){ imp.err='pay'; render(); return; }
  imp.err=''; imp.file=file.name;
  try{
    await loadXLSX();
    const buf=await file.arrayBuffer();
    let wb;
    try{ wb=XLSX.read(buf,{type:'array',cellDates:false}); }
    catch(e){ throw new Error(/password|encrypt/i.test(e.message)?'암호가 걸린 파일이에요. 엑셀에서 암호 없이 다시 저장해서 올려주세요':'파일을 읽을 수 없어요. 엑셀(xlsx·xls)이나 csv 파일인지 확인해 주세요'); }
    let best=null;
    for(const n of wb.SheetNames){ const g=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}); if(!best||g.length>best.length) best=g; }
    if(!best||!best.length) throw new Error('파일에 내용이 없어요');
    imp.grid=best; detectCols(); buildRows();
  }catch(e){ imp.err=e.message; imp.grid=null; imp.rows=[]; }
  render();
  if(imp.rows.length&&innerWidth<960) document.querySelector('.prev')?.closest('.card')?.scrollIntoView({behavior:'smooth',block:'start'});
}
function cellDate(v){
  if(v instanceof Date&&!isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number'&&v>30000&&v<60000){ const d=new Date(Math.round((v-25569)*864e5)); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`; }
  return normDate(v);
}
function cellNum(v){ return typeof v==='number'?v:toNum(v); }
function detectCols(){
  const g=imp.grid, RX={date:/(이용|거래|승인|매출|결제)?\s*(일자|일시|날짜|년월일)|^이용일$|^거래일$|^승인일$/, merchant:/가맹점|이용처|사용처|상호|이용하신\s*곳|거래처|내용|적요/, amount:/(이용|승인|결제|청구|매출|거래)\s*금액|^금액/};
  const BAD=/수수료|이자|포인트|할인|잔액|원금|외화|해외|적립|혜택|회차|개월|USD/;
  imp.head=-1; imp.map={date:-1,merchant:-1,amount:-1};
  for(let r=0;r<Math.min(g.length,40);r++){
    const row=g[r].map(c=>String(c).replace(/\s+/g,' ').trim());
    const d=row.findIndex(c=>RX.date.test(c)), a=row.findIndex(c=>RX.amount.test(c)&&!BAD.test(c));
    if(d>=0&&a>=0){ imp.head=r; imp.map.date=d; imp.map.amount=a; imp.map.merchant=row.findIndex(c=>RX.merchant.test(c)&&!BAD.test(c)); break; }
  }
  const start=imp.head+1, sample=g.slice(start,start+40), ncol=Math.max(...g.slice(0,60).map(r=>r.length));
  const score=f=>Array.from({length:ncol},(_,i)=>sample.filter(r=>f(r[i])).length);
  const best=(arr,skip)=>{let bi=-1,bv=0;arr.forEach((v,i)=>{if(!skip.includes(i)&&v>bv){bv=v;bi=i;}});return bi;};
  if(imp.map.date<0) imp.map.date=best(score(v=>!!cellDate(v)),[]);
  if(imp.map.amount<0) imp.map.amount=best(score(v=>{const n=cellNum(v);return !isNaN(n)&&Math.abs(n)>=100&&Math.abs(n)<1e8;}),[imp.map.date]);
  if(imp.map.merchant<0){ const lens=Array.from({length:ncol},(_,i)=>sample.reduce((a,r)=>a+(typeof r[i]==='string'&&!cellDate(r[i])&&isNaN(toNum(r[i]))?r[i].length:0),0)); imp.map.merchant=best(lens,[imp.map.date,imp.map.amount]); }
}
function buildRows(){
  const {date:di,merchant:mi,amount:ai}=imp.map, out=[];
  for(let r=imp.head+1;r<imp.grid.length;r++){
    const row=imp.grid[r]; const date=cellDate(row[di]), amount=cellNum(row[ai]);
    const merchant=String(mi>=0?row[mi]??'':'').replace(/\s+/g,' ').trim();
    if(!date||isNaN(amount)||amount===0) continue;
    if(/합계|소계|총\s*계|총이용/.test(merchant)) continue;
    const dup=liveTx().some(t=>t.date===date&&t.amount===amount&&(t.merchant||t.memo)===merchant);
    out.push({date,merchant,amount,cat:autoCat(merchant),on:!dup,dup});
  }
  imp.rows=out;
}

      }catch(err){ sync={}; setSync('err','연결 실패: '+err.message+' (주소와 비밀번호, 배포 권한을 확인해 주세요)'); render(); }
    },
    unlinkSync:()=>{ if(!confirm('동기화를 끊을까요? 이 기기의 내역은 그대로 남아요.')) return; sync={}; localStorage.removeItem(LS_SYNC); ui.syncMsg=''; render(); toast('연결을 끊었어요'); },
    addPay:()=>{ const v=$('#newPay').value.trim(); if(!v||state.settings.pays.includes(v)) return; state.settings.pays.push(v); touchSettings(); render(); toast('추가했어요'); },
    addRule:()=>{ const kw=$('#newKw').value.trim(), cat=$('#newRuleCat').value; if(!kw) return; state.settings.rules.unshift({kw,cat}); touchSettings(); render(); toast('규칙을 추가했어요'); },
    addCat:()=>{ const v=$('#newCat').value.trim(), g=$('#newCatGroup').value; if(!v||catOf(v)) return; state.settings.cats.push({group:g,name:v,budget:0}); touchSettings(); render(); toast('분류를 추가했어요'); },
    exportJson:()=>download(`가계부백업_${todayStr()}.json`,JSON.stringify(state,null,1),'application/json'),
    exportCsv
  };
  if(A[act]) A[act]();
});
document.addEventListener('change',e=>{
  const t=e.target, d=t.dataset;
  if(d.ion!==undefined){ imp.rows[d.ion].on=t.checked; render(); return; }
  if(d.icat!==undefined){ imp.rows[d.icat].cat=t.value; render(); return; }
  if(d.imap!==undefined){ imp.map[d.imap]=Number(t.value); buildRows(); render(); return; }
  if(t.id==='xlsFile'&&t.files[0]){ readXls(t.files[0]); t.value=''; return; }
  if(d.budget!==undefined){ const c=catOf(d.budget); const n=toNum(t.value); c.budget=isNaN(n)?0:n; t.value=c.budget?won(c.budget):''; touchSettings(); toast('예산을 바꿨어요'); return; }
  if(t.id==='importFile'&&t.files[0]){
    const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.settings||!Array.isArray(d.tx)) throw 0;
      if(!confirm(`백업의 내역 ${d.tx.filter(x=>!x.deleted).length}건을 지금 내역과 합칠까요?`)) return;
      const map={}; state.tx.forEach(x=>map[x.id]=x); d.tx.forEach(x=>{ if(!map[x.id]||x.updatedAt>=map[x.id].updatedAt) map[x.id]=x; });
      state.tx=Object.values(map); if((d.settings.updatedAt||0)>=(state.settings.updatedAt||0)) state.settings=d.settings;
      persist(); render(); toast('불러왔어요'); }catch(err){ toast('백업 파일을 읽을 수 없어요'); } }; r.readAsText(t.files[0]);
  }
});
document.addEventListener('input',e=>{ if(e.target.id==='syncUrl'){ $('#urlErr').classList.remove('on'); e.target.classList.remove('err'); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&form) closeForm(); if(e.key==='Enter'&&form&&e.target.tagName==='INPUT') saveForm(); });
$('#dim').onclick=closeForm; $('#fab').onclick=()=>openForm(null); $('#sideAdd').onclick=()=>openForm(null);

render();
if(sync.url){ (async()=>{ setSync('busy',''); try{ const d=await api({action:'save',data:state}); applyServer(d); setSync('ok','마지막 동기화 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})); }catch(e){ setSync('err','동기화 실패: '+e.message); } softRender(); })(); }
</script>
</body>
</html>
