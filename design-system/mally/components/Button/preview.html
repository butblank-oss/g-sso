<!-- @dsCard group="액션" height=300 subtitle="상태 9종" -->
<div class="m-root" style="padding:20px;background:var(--bg)">
<div class="m-col" style="max-width:340px">
 <div class="m-row"><button class="m-btn m-btn--primary">기본</button><button class="m-btn m-btn--primary is-hover">호버</button><button class="m-btn m-btn--primary is-pressed">눌림</button></div>
 <div class="m-row"><button class="m-btn m-btn--primary is-focus">포커스</button><button class="m-btn m-btn--primary" disabled>비활성</button><button class="m-btn m-btn--primary is-loading"><span class="m-spin"></span>저장 중</button></div>
 <div class="m-row"><button class="m-btn m-btn--primary is-success">✓ 완료</button><button class="m-btn is-error">다시 확인</button><button class="m-btn m-btn--primary is-selected">선택됨</button></div>
 <div class="m-row"><button class="m-btn m-btn--secondary m-btn--sm">보조</button><button class="m-btn m-btn--ghost">나중에 할게요</button></div>
</div>
</div>
