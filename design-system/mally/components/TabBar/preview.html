 btns.forEach(b=>b.addEventListener('click',()=>{btns.forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');

   const left=Math.min(from.left,to.left)-p.left,right=Math.max(from.right,to.right)-p.left;
